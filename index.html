<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>Chelsea's Christmas Wish List 🎄</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183b30;background:#f9f5ea}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#12382d,#25654b);color:white;text-align:center;padding:65px 20px 55px;border-bottom:7px solid #d9b76c}header .small{color:#e5cb88;letter-spacing:.22em;text-transform:uppercase;font-size:12px}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,72px);margin:15px 0}header p{color:#e8eee7}main{max-width:1150px;margin:auto;padding:36px 18px 70px}.tools{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}input{border:1px solid #c6c5b6;border-radius:25px;padding:12px 18px;min-width:230px;font:inherit;background:white}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid #b8c6ba;background:white;border-radius:24px;padding:10px 15px;color:#1b4938;cursor:pointer}.filters button.active{background:#1b4938;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.card{background:white;border:1px solid #e7e0cf;border-radius:17px;overflow:hidden;box-shadow:0 6px 24px #2b3e2910;display:flex;flex-direction:column}.visual{height:125px;background:linear-gradient(125deg,#edf0e6,#e8e0ce);display:grid;place-items:center;font-size:64px}.body{padding:21px;display:flex;flex:1;flex-direction:column}.category{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9c4c4b;font-weight:800}h2{font-family:Georgia,serif;font-size:23px;margin:9px 0}.store{color:#647368;font-size:13px}.notes{font-size:14px;color:#59665d;line-height:1.5;flex:1}.price{font-size:18px;font-weight:750;margin:8px 0 17px}.shop{background:#ad3542;color:white;text-decoration:none;text-align:center;border-radius:9px;padding:12px 15px;font-weight:700}.shop:hover{background:#842331}.empty{text-align:center;padding:30px}.status{color:#7a4b36;text-align:center;margin:20px 0}footer{text-align:center;padding:35px;color:#65776b;font-size:13px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c5a256;outline-offset:3px}</style></head><body><header><div class="small">❄ ✦ Christmas 2026 ✦ ❄</div><h1>Chelsea's Christmas Wish List</h1><p>A little holiday inspiration, all wrapped up in one place 🎁</p></header><main><div class="tools"><div class="filters" id="filters"></div><input id="search" type="search" placeholder="Search gift ideas…" aria-label="Search gifts"></div><div class="status" id="status" aria-live="polite">Loading gift ideas…</div><div class="grid" id="grid"></div></main><footer>Made with a little Christmas magic ✨ · Updated from Google Sheets</footer><script>
// Spreadsheet tab: Christmas wishlist (gid 1165466726). Publish this tab as CSV in Google Sheets.
const SHEET_ID='1rKvoBUOSOwSkBN16kdCG2EeH3M_z9C77NyGypsYpvsg';
const GID='1165466726';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const fallback=[
['Cycling','OrionRide Valley Glow cycling hoodie','OrionRide','Selected variant','','https://www.orionride.com/products/orionride-valley-glow-womens-long-sleeve-cycling-hoodie-shirt?variant=49261552468212'],
['Cycling','Cardo SYNC communication system','Cardo','Single or Duo; either is great','$169.95','https://cardosystems.com/pages/cardo-sync'],
['Outdoors','TravelNest Hammock + Straps','Headwaters Outfitters','Charcoal; previously sold out','$54.95','https://shop.com/p/8523410800891?variantId=45811357188347'],
['Outdoors','Chairs','Shop','Selected variant','','https://shop.com/p/8200185708757?variantId=45025840529621'],
['Clothing','Rocky Mountain Camp Tee','Rachel Pohl Art','Selected variant','','https://rachelpohlart.com/products/rocky-mountain-camp-tee?variant=46673253466270'],
['Clothing','Hildegard von Bingen: The Saint Classic Tee','Archival Apparel','Natural • Large','$30.00','https://archivalapparel.co/collections/best-sellers/products/hildegard-von-bingen-the-saint-t-shirt-1'],
['Clothing','J.S. Bach Skeleton Classic Crewneck','Archival Apparel','Confirm size and color','$50.00','https://archivalapparel.co/products/j-s-bach-skeleton-crewneck-sweatshirt'],
['Clothing','Bob Dylan – Road Drawings Graphic Tee','Muazoe','Apricot • Large; check size at checkout','$29.99','https://www.muazoe.com/products/singer-aesthetic-print-round-neck-t-shirt-kf9k?variant=548e1641-f1a0-44f8-b5b4-8cd38e41020a'],
['Experiences','Woodhouse Spa Broomfield Gift Card','Woodhouse Spa','Any amount','','https://na1.meevo.com/CustomerPortal/egift/order/gift-type?tenantId=200426&locationId=203709'],
['More ideas','Amazon wish list','Amazon','Additional gift ideas','','https://www.amazon.com/hz/wishlist/ls/2F9OV5PON7OED?ref_=wl_share']];
function parseCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
let gifts=fallback,category='All';const icons={'Cycling':'🚲','Outdoors':'🏕️','Clothing':'👕','Experiences':'💆','More ideas':'🎁'};const el=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};function render(){let filters=document.getElementById('filters');filters.replaceChildren();['All',...new Set(gifts.map(g=>g[0]))].forEach(c=>{let b=el('button',c===category?'active':'',c==='All'?'All gifts':c);b.onclick=()=>{category=c;render()};filters.append(b)});let term=document.getElementById('search').value.toLowerCase(),grid=document.getElementById('grid');grid.replaceChildren();let selected=gifts.filter(g=>(category==='All'||g[0]===category)&&g.join(' ').toLowerCase().includes(term));selected.forEach(g=>{let [cat,name,store,notes,price,url]=g;let card=el('article','card'),visual=el('div','visual',icons[cat]||'🎁'),body=el('div','body');body.append(el('div','category',cat),el('h2','',name),el('div','store',store),el('p','notes',notes));if(price)body.append(el('div','price',price));let a=el('a','shop','Shop gift ↗');a.href=/^https:\/\//.test(url)?url:'#';a.target='_blank';a.rel='noopener noreferrer';body.append(a);card.append(visual,body);grid.append(card)});if(!selected.length)grid.append(el('p','empty','No gifts match your search.'))}
document.getElementById('search').addEventListener('input',render);render();async function load(){try{let r=await fetch(CSV_URL,{cache:'no-store'});if(!r.ok)throw Error('Sheet not publicly readable');let rows=parseCSV(await r.text());let header=rows.findIndex(r=>r[0]?.trim()==='Category'&&r[1]?.trim()==='Gift idea');if(header<0)throw Error('Missing headers');let data=rows.slice(header+1).filter(r=>r[0]&&r[1]&&/^https:\/\//.test(r[5]||''));if(!data.length)throw Error('No gifts');gifts=data;document.getElementById('status').textContent='';render()}catch(e){document.getElementById('status').textContent='Showing saved gift list. To enable live updates, publish the Google Sheets tab to the web as CSV and ensure public CSV access.'}}load();</script></body></html>
